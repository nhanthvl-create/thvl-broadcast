databases:
  - name: thvl-db
    databaseName: thvl_broadcast
    user: thvl_user
    plan: free

services:
  - type: web
    name: thvl-broadcast
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: thvl-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "1"
